<!-- Filter Bar -->
<section class="filter-section">
  <div class="filter-buttons">
    <button
      class="filter-btn"
      [class.active]="activeFilter === 'All'"
      (click)="setFilter('All')"
    >All</button>
    <button
      class="filter-btn"
      [class.active]="activeFilter === 'New Arrivals'"
      (click)="setFilter('New Arrivals')"
    >New Arrivals</button>
    <button
      class="filter-btn"
      [class.active]="activeFilter === 'Summer Collection'"
      (click)="setFilter('Summer Collection')"
    >Summer Collection</button>
    <button
      class="filter-btn"
      [class.active]="activeFilter === 'Best Sellers'"
      (click)="setFilter('Best Sellers')"
    >Best Sellers</button>
  </div>
  <p class="filter-quote">"Elegance is the only beauty that never fades."</p>
</section>

<!-- New Arrivals -->
<section class="product-section" *ngIf="activeFilter === 'All' || activeFilter === 'New Arrivals'">
  <div class="section-header">
    <h2 class="section-title">New Arrivals</h2>
    <a href="#" class="section-link">Explore All</a>
  </div>
  <div class="carousel">
    <app-product-card-component
      *ngFor="let product of newArrivals"
      [product]="product"
    />
  </div>
</section>

<!-- Summer Collection -->
<section class="product-section" *ngIf="activeFilter === 'All' || activeFilter === 'Summer Collection'">
  <div class="section-header">
    <h2 class="section-title">Summer Collection</h2>
    <a href="#" class="section-link">View Gallery</a>
  </div>
  <div class="carousel">
    <app-product-card-component
      *ngFor="let product of summerCollection"
      [product]="product"
    />
  </div>
</section>

<!-- Best Sellers -->
<section class="product-section" *ngIf="activeFilter === 'All' || activeFilter === 'Best Sellers'">
  <div class="section-header">
    <h2 class="section-title">Best Sellers</h2>
    <a href="#" class="section-link">See More</a>
  </div>
  <div class="carousel">
    <app-product-card-component
      *ngFor="let product of bestSellers"
      [product]="product"
    />
  </div>
</section>

<!-- Chatbot -->
<app-chatbot />
